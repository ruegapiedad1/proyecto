<div class="fondo">

  <div class="login-card">

    <h1>SI</h1>
    <h2>Sistema Inventario</h2>

    <input
      type="text"
      placeholder="Usuario"
      [(ngModel)]="usuario">

    <input
      type="password"
      placeholder="Contraseña"

    <button (click)="ingresar()">
      Ingresar

    <p class="demo">
      Demo: admin / 1234
    </p>

  </div>

</div>
